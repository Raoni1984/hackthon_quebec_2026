# ============================================================
# CI/CD — Saint-Roch en Réseau
# Déclenchement : push sur main ou PR vers main
# Jobs : lint Python + test d'import + déploiement Railway
# ============================================================

name: CI/CD Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ─────────────────────────────────────────────────────────
  # 1. LINT & VALIDATION
  # ─────────────────────────────────────────────────────────
  lint:
    name: 🔍 Lint & validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Vérifier la syntaxe Python (ruff)
        run: |
          pip install ruff
          ruff check backend/api/ backend/scripts/ --ignore E501

      - name: Vérifier les imports de l'API
        run: |
          cd backend
          python -c "from api.main import app; print('✅ API importée sans erreur')"

  # ─────────────────────────────────────────────────────────
  # 2. TEST DU SCRIPT D'IMPORT (dry-run avec données sample)
  # ─────────────────────────────────────────────────────────
  test-import:
    name: 🧪 Test import pandas
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Test import CSV en dry-run
        env:
          # Variables factices pour le dry-run (pas de vraie BD)
          SUPABASE_URL: https://fake.supabase.co
          SUPABASE_SERVICE_KEY: fake_key_for_testing
        run: |
          cd backend
          python -c "
          import pandas as pd
          import sys, os
          sys.path.insert(0, '.')
          from scripts.import_data import load_dataframe, clean_poi_dataframe
          df = load_dataframe('data/sample_pois.csv')
          df_clean = clean_poi_dataframe(df)
          assert len(df_clean) > 0, 'Aucun lieu valide après nettoyage'
          print(f'✅ {len(df_clean)} lieux valides dans le fichier sample')
          "

  # ─────────────────────────────────────────────────────────
  # 3. DÉPLOIEMENT (seulement sur push main)
  # ─────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Déploiement Railway
    runs-on: ubuntu-latest
    needs: [lint, test-import]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Installer Railway CLI
        run: npm install -g @railway/cli

      - name: Déployer sur Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --service backend --detach
